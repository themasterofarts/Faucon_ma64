# ros_gz_bridge configuration for the Faucon drone.
#
# Topic naming convention:
#   ROS  : /faucon/drone/<sensor> for the public Faucon interface
#   Gz   : drone/<sensor>         for the internal Gazebo model topics
#
# Note: camera image is bridged separately via ros_gz_image image_bridge,
#       not listed here (the image_bridge handles Image + CameraInfo together).

# ── Control (ROS → Gazebo) ─────────────────────────────────────────────────

- ros_topic_name: "/faucon/drone/cmd_vel"
  gz_topic_name:  "drone/cmd_vel"
  ros_type_name:  "geometry_msgs/msg/Twist"
  gz_type_name:   "gz.msgs.Twist"
  direction: ROS_TO_GZ

# Motor safety enable — publish True to arm, False to disarm
- ros_topic_name: "/faucon/drone/arm"
  gz_topic_name:  "drone/enable"
  ros_type_name:  "std_msgs/msg/Bool"
  gz_type_name:   "gz.msgs.Boolean"
  direction: ROS_TO_GZ

# Motor speed commands from drone_velocity_controller → Gazebo motor models
- ros_topic_name: "/drone/command/motor_speed"
  gz_topic_name:  "drone/command/motor_speed"
  ros_type_name:  "actuator_msgs/msg/Actuators"
  gz_type_name:   "gz.msgs.Actuators"
  direction: ROS_TO_GZ

# ── Sensors (Gazebo → ROS) ─────────────────────────────────────────────────

- ros_topic_name: "/faucon/drone/gps"
  gz_topic_name:  "drone/gnss/fix"
  ros_type_name:  "sensor_msgs/msg/NavSatFix"
  gz_type_name:   "gz.msgs.NavSat"
  direction: GZ_TO_ROS

- ros_topic_name: "/faucon/drone/imu"
  gz_topic_name:  "drone/imu"
  ros_type_name:  "sensor_msgs/msg/Imu"
  gz_type_name:   "gz.msgs.IMU"
  direction: GZ_TO_ROS

- ros_topic_name: "/faucon/drone/camera/camera_info"
  gz_topic_name:  "drone/camera/camera_info"
  ros_type_name:  "sensor_msgs/msg/CameraInfo"
  gz_type_name:   "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# ── Odometry & TF (Gazebo → ROS) ───────────────────────────────────────────

- ros_topic_name: "/faucon/drone/odom"
  gz_topic_name:  "drone/odom"
  ros_type_name:  "nav_msgs/msg/Odometry"
  gz_type_name:   "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# TF published by the OdometryPublisher plugin (world → drone_base_link)
- ros_topic_name: "/tf"
  gz_topic_name:  "drone/tf"
  ros_type_name:  "tf2_msgs/msg/TFMessage"
  gz_type_name:   "gz.msgs.Pose_V"
  direction: GZ_TO_ROS
