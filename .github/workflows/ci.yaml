name: ROS2 Jazzy CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ROS_DISTRO: jazzy
  WS_DIR: /root/ws

# Organisation :
#   build ──┬── unit-tests ─────────┬── coverage (rapport de couverture Python)
#           └── integration-tests ──┘
# - build              : colcon build + verification de syntaxe ; le workspace installe
#                        est transmis aux jobs de tests (artefact ros-install).
# - unit-tests         : tests unitaires (pytest) sous coverage.py.
# - integration-tests  : vrais noeuds ROS 2 sans Gazebo (chaine de securite, mission),
#                        noeuds instrumentes par coverage.py.
# - coverage           : fusion des donnees de couverture, tableau dans le resume du
#                        job, rapport HTML et coverage.xml en artefacts. Non bloquant.
# Les tests se lancent aussi en local : ./tests/run_tests.sh

jobs:
  build:
    name: Build & Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    container:
      image: osrf/ros:jazzy-desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dependances ROS
        uses: ./.github/actions/ros-deps

      - name: Clone dependency virtual_maize_field
        shell: bash
        run: |
          set -e
          cd "$WS_DIR/src"
          # if [ ! -d "virtual_maize_field" ]; then
          #   # HTTPS pour la CI (pas de clés SSH requises)
          #   git clone https://github.com/themasterofarts/virtual_maize_field.git
          # fi
          # echo " virtual_maize_field cloned."

      - name: colcon build
        shell: bash
        run: |
          set -e
          source /opt/ros/$ROS_DISTRO/setup.sh
          cd "$WS_DIR"
          colcon build --merge-install --event-handlers console_cohesion+
          echo "::notice:: Build completed successfully"

      - name: Python syntax check
        shell: bash
        run: |
          set -e
          cd "$WS_DIR/src/this_repo"
          find . -name '*.py' -not -path '*/node_modules/*' -not -path './virtual_maize_field/*' \
            -print0 | xargs -0 python3 -m py_compile
          echo "::notice:: Syntaxe Python OK"

      - name: Archive du workspace installe
        shell: bash
        run: tar czf /tmp/ros-install.tgz -C "$WS_DIR" install

      - name: Upload workspace installe
        uses: actions/upload-artifact@v4
        with:
          name: ros-install
          path: /tmp/ros-install.tgz
          retention-days: 3

      - name: Upload logs (artefacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colcon-logs
          path: /root/ws/log
          if-no-files-found: ignore

      - name:  Success indicator
        if: success()
        run: |
          echo "## 🟢 Build OK" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ✅ *All steps passed*" >> $GITHUB_STEP_SUMMARY
          echo "🟢 Everything looks good! ✅"

      - name: 🔴 Failure indicator
        if: failure()
        run: |
          echo "## 🔴 Build FAILED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ❌ *Check logs & artifacts*" >> $GITHUB_STEP_SUMMARY
          echo "::error::❌ Build failed. See summary and artifacts."

  tests:
    name: ${{ matrix.suite == 'unit' && 'Unit tests' || 'Integration tests' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [ unit, integration ]

    container:
      image: osrf/ros:jazzy-desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependances ROS
        uses: ./.github/actions/ros-deps

      - name: Download workspace installe
        uses: actions/download-artifact@v4
        with:
          name: ros-install
          path: /tmp

      - name: Extract workspace installe
        shell: bash
        run: tar xzf /tmp/ros-install.tgz -C "$WS_DIR"

      - name: Tests (${{ matrix.suite }})
        shell: bash
        run: |
          set -e
          source /opt/ros/$ROS_DISTRO/setup.bash
          # workspace source : tests URDF ($(find faucon_base_desc)), faucon_common installe
          source "$WS_DIR/install/setup.bash"
          cd "$WS_DIR/src/this_repo"
          ./tests/run_tests.sh ${{ matrix.suite }}

      - name: Resume des tests
        if: always()
        shell: bash
        run: |
          cd "$WS_DIR/src/this_repo"
          python3 - "${{ matrix.suite }}" >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import sys, xml.etree.ElementTree as ET
          suite = sys.argv[1]
          try:
              r = ET.parse(f"test-results/{suite}.xml").getroot()
              s = r if r.tag == "testsuite" else r.find("testsuite")
              t, f, e, k = (int(s.get(a, 0)) for a in ("tests", "failures", "errors", "skipped"))
              icon = "🟢" if f + e == 0 else "🔴"
              print(f"## {icon} Tests {suite} : {t - f - e - k} reussis, {f + e} en echec, {k} ignores")
              for c in s.iter("testcase"):
                  if c.find("failure") is not None or c.find("error") is not None:
                      print(f"- ❌ `{c.get('classname')}.{c.get('name')}`")
          except FileNotFoundError:
              print(f"## 🔴 Tests {suite} : aucun resultat (voir les journaux du job)")
          EOF

      - name: Upload donnees de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.suite }}
          path: ${{ env.WS_DIR }}/src/this_repo/.coverage*
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload resultats et journaux des noeuds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.suite }}
          path: ${{ env.WS_DIR }}/src/this_repo/test-results
          if-no-files-found: ignore

  coverage:
    name: Coverage report
    needs: [ build, tests ]
    # meme si des tests echouent : la couverture reste utile pour comprendre l'echec
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install coverage.py
        # meme version que python3-coverage du conteneur ROS (Ubuntu 24.04)
        run: python3 -m pip install --quiet --break-system-packages "coverage==7.4.4"

      - name: Download donnees de couverture
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          merge-multiple: true
          path: .

      - name: Rapport de couverture
        run: |
          python3 -m coverage combine --rcfile=.coveragerc
          python3 -m coverage report --rcfile=.coveragerc
          python3 -m coverage html --rcfile=.coveragerc -q
          python3 -m coverage xml --rcfile=.coveragerc -q
          {
            echo "## 📊 Couverture Python (tests unitaires + integration)"
            echo ""
            echo "Couverture totale : **$(python3 -m coverage report --rcfile=.coveragerc --format=total)%**"
            echo ""
            python3 -m coverage report --rcfile=.coveragerc --format=markdown
            echo ""
            echo "Rapport detaille : artefact \`coverage-report\` (ouvrir \`coverage_html/index.html\`)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload rapport de couverture
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage_html
            coverage.xml
