name: ROS2 Jazzy CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Checks
    runs-on: ubuntu-24.04

    container:
      image: osrf/ros:jazzy-desktop

    env:
      ROS_DISTRO: jazzy
      WS_DIR: /root/ws

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install base tools & ROS deps
        run: |
          # Retries pour les erreurs réseau transitoires (520, timeout, etc.)
          echo 'Acquire::Retries "5";' > /etc/apt/apt.conf.d/80-retries
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl gnupg lsb-release rsync \
            python3-pip python3-colcon-common-extensions python3-vcstool \
            build-essential cmake \
            ros-jazzy-ros2-control ros-jazzy-ros2-controllers \
            ros-jazzy-ros-gz ros-jazzy-ros-gz-bridge ros-jazzy-ros-gz-image \
            ros-jazzy-gz-ros2-control \
            ros-jazzy-behaviortree-cpp ros-jazzy-behaviortree-cpp-dbgsym ros-jazzy-nav2-bringup \
            ros-jazzy-rosbridge-server ros-jazzy-pcl-ros \
            libopencv-dev
          # Packages Python depuis Ubuntu universe peu fiables → pip
          pip3 install --quiet --break-system-packages ujson utm pyproj
          rosdep update || (rosdep init && rosdep update)

      - name:  Prepare workspace
        shell: bash
        run: |
          mkdir -p "$WS_DIR/src"
          # copie le dépôt courant dans le workspace (sans .git)
          rsync -a --exclude='.git' "$GITHUB_WORKSPACE/" "$WS_DIR/src/this_repo"

      - name: Clone dependency virtual_maize_field 
        shell: bash
        run: |
          set -e
          cd "$WS_DIR/src"
          # if [ ! -d "virtual_maize_field" ]; then
          #   # HTTPS pour la CI (pas de clés SSH requises)
          #   git clone https://github.com/themasterofarts/virtual_maize_field.git
          # fi
          # echo " virtual_maize_field cloned."

      - name:  rosdep install
        shell: bash
        run: |
          set -e
          source /opt/ros/$ROS_DISTRO/setup.sh
          cd "$WS_DIR"
          # --skip-keys : packages déjà installés ci-dessus (apt ou pip)
          rosdep install --from-paths src --ignore-src -y \
            --skip-keys "python3-ujson python3-utm python3-pyproj ros-jazzy-rosbridge-server ros-jazzy-pcl-ros"

      - name: colcon build
        shell: bash
        run: |
          set -e
          source /opt/ros/$ROS_DISTRO/setup.sh
          cd "$WS_DIR"
          colcon build --merge-install --event-handlers console_cohesion+
          echo "::notice:: Build completed successfully"

      

      - name: Upload logs (artefacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colcon-logs
          path: /root/ws/log
          if-no-files-found: ignore

      - name:  Success indicator
        if: success()
        run: |
          echo "## 🟢 Build OK" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ✅ *All steps passed*" >> $GITHUB_STEP_SUMMARY
          echo "🟢 Everything looks good! ✅"

      - name: 🔴 Failure indicator
        if: failure()
        run: |
          echo "## 🔴 Build FAILED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ❌ *Check logs & artifacts*" >> $GITHUB_STEP_SUMMARY
          echo "::error::❌ Build failed. See summary and artifacts."
